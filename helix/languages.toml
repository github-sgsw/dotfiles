[[language]]
name = "haskell"
formatter = {command = 'fourmolu', args = ["--stdin-input-file", "%{buffer_name}"]}
auto-format = true

[[language]]
name = "cabal"
formatter = {command = 'cabal-gild', args = ["--stdin", "%{buffer_name}"]}
auto-format = true

[language-server.phpantom]
command = "phpantom_lsp"

[[language]]
name = "php"
language-servers = ["phpantom"]
