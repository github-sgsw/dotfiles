theme = "tokyonight"

[editor]
color-modes = true
default-yank-register = "+"
trim-trailing-whitespace = true

[editor.statusline]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-progress-messages = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.auto-save]
focus-lost = true

[editor.indent-guides]
render = true

[editor.word-completion]
trigger-length = 4
